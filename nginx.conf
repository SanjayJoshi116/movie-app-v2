# HSTS only when the outer TLS terminator says the request came in over HTTPS;
# nginx skips an add_header whose value is empty, so plain HTTP gets none.
# (A forged header over plain HTTP is harmless: browsers ignore STS there.)
map $http_x_forwarded_proto $hsts_header {
    https   "max-age=31536000";
    default "";
}

# The entry page is revalidated on every load, so after a redeploy a browser
# never keeps an old index.html pointing at chunks that no longer exist.
# $uri is /index.html after try_files/index fall back, so every SPA route gets
# it. Empty for everything else, so no header is sent.
map $uri $entry_cache_control {
    /index.html "no-cache";
    default     "";
}

# Everything CRA puts under /static/ has a content hash in its name, so a given
# URL never changes content and can be cached for a year. Sent by an add_header
# without `always` (below), so a missing chunk's 404 is never cached.
# Unhashed public/ files (favicon, manifest, logos) live at the root, not here.
map $uri $static_cache_control {
    ~^/static/ "public, max-age=31536000, immutable";
    default    "";
}

# Access logs never carry one-time credentials: a password-reset link's
# uid/token, or a TMDB callback's request_token. The reset page's own API
# calls send the reset URL as their Referer, so that's redacted too. Same
# fields as nginx's default `combined` format otherwise.
map $request_uri $log_request_uri {
    ~^/reset-password/   "/reset-password/[redacted]";
    ~^/tmdb-callback     "/tmdb-callback?[redacted]";
    default              $request_uri;
}
map $http_referer $log_referer {
    ~^https?://[^/]+/reset-password/   "[redacted reset link]";
    ~^https?://[^/]+/tmdb-callback     "[redacted tmdb callback]";
    default                            $http_referer;
}
log_format redacted '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $log_request_uri $server_protocol" $status $body_bytes_sent '
                    '"$log_referer" "$http_user_agent"';

server {
    listen 80;
    # No nginx version in the Server header or on error pages.
    server_tokens off;
    # The official image links this file to stdout, so `docker logs` still works.
    access_log /var/log/nginx/access.log redacted;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 8m;

    # Server-level headers are inherited by every location below only while no
    # location declares its own add_header — keep it that way.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security $hsts_header always;
    # Every external origin the app loads must be listed here (TMDB images,
    # Google Fonts, YouTube trailer embeds). 'unsafe-inline' styles: antd's
    # runtime CSS-in-JS and React style props. No inline script: the build sets
    # INLINE_RUNTIME_CHUNK=false (Dockerfile.frontend).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://image.tmdb.org https://i.ytimg.com; connect-src 'self'; frame-src https://www.youtube-nocookie.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Cache-Control $entry_cache_control always;
    # No `always`: only 2xx/3xx get it. At most one of the two maps is non-empty
    # for a URI, and nginx skips an empty add_header, so one Cache-Control.
    add_header Cache-Control $static_cache_control;

    # The app's own text assets. Off again for /api/ and /media/ below: API JSON
    # carries tokens next to request-influenced content (BREACH), and media is
    # already-compressed images. text/html is always included.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # Both JS types: which one mime.types maps .js to depends on the nginx version.
    gzip_types application/javascript text/javascript text/css application/json application/manifest+json image/svg+xml;

    # A missing hashed asset (an old chunk after a redeploy) is a 404, never
    # index.html served as JavaScript with status 200.
    location /static/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        gzip off;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Origin "";
    }

    location /media/ {
        gzip off;
        proxy_pass http://backend:8000/media/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
