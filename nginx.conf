# HSTS only when the outer TLS terminator says the request came in over HTTPS;
# nginx skips an add_header whose value is empty, so plain HTTP gets none.
# (A forged header over plain HTTP is harmless: browsers ignore STS there.)
map $http_x_forwarded_proto $hsts_header {
    https   "max-age=31536000";
    default "";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 8m;

    # Server-level headers are inherited by every location below only while no
    # location declares its own add_header — keep it that way.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security $hsts_header always;
    # Every external origin the app loads must be listed here (TMDB images,
    # Google Fonts, YouTube trailer embeds). 'unsafe-inline' styles: antd's
    # runtime CSS-in-JS and React style props. No inline script: the build sets
    # INLINE_RUNTIME_CHUNK=false (Dockerfile.frontend).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://image.tmdb.org; connect-src 'self'; frame-src https://www.youtube-nocookie.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Origin "";
    }

    location /media/ {
        proxy_pass http://backend:8000/media/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
