services:
  db:
    image: postgres:15-alpine
    # Only its own secret (POSTGRES_PASSWORD). The app's keys stay in
    # .env.docker, which this container never sees.
    env_file: .env.db
    environment:
      POSTGRES_DB: cinedb
      POSTGRES_USER: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cinedb"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    # .env.db supplies the same POSTGRES_PASSWORD the db gets; settings.py
    # falls back to it when DB_PASSWORD is unset, so it's defined once.
    env_file:
      - .env.docker
      - .env.db
    environment:
      DB_HOST: db
      # nginx (frontend container) is the one proxy in front of Django; throttles
      # key on the client address it appends to X-Forwarded-For. Add one per
      # extra proxy/TLS terminator in front (set it in the shell or root .env).
      TRUSTED_PROXY_COUNT: "${TRUSTED_PROXY_COUNT:-1}"
    volumes:
      - media_data:/app/media
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/health/\")'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "3000:80"
    restart: unless-stopped

volumes:
  pgdata:
  media_data:
