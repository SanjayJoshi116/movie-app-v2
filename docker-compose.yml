services:
  db:
    image: postgres:15-alpine
    env_file: .env.docker
    environment:
      POSTGRES_DB: cinedb
      POSTGRES_USER: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cinedb"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file: .env.docker
    environment:
      DB_HOST: db

  proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    depends_on:
      - backend
    env_file: .env.docker
    environment:
      DJANGO_API_URL: http://backend:8000/api

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      - proxy
    ports:
      - "80:80"

volumes:
  pgdata:
