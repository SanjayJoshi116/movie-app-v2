services:
  db:
    image: postgres:15-alpine
    env_file: .env.docker
    environment:
      POSTGRES_DB: cinedb
      POSTGRES_USER: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cinedb"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file: .env.docker
    environment:
      DB_HOST: db
    volumes:
      - ./backend/userdata/migrations:/app/userdata/migrations
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; s=socket.socket(); s.connect((\"localhost\",8000)); s.close()'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    restart: unless-stopped

  proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    depends_on:
      backend:
        condition: service_healthy
    env_file: .env.docker
    environment:
      DJANGO_API_URL: http://backend:8000/api
    healthcheck:
      test: ["CMD", "node", "-e", "const net=require('net');const s=net.createConnection(3001,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      proxy:
        condition: service_healthy
    ports:
      - "80:80"
      - "3000:80"
    restart: unless-stopped

volumes:
  pgdata:
