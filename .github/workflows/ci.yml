name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a pull request cancels that PR's older run. Runs on main are
# never cancelled, so every commit there keeps its own result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend (typecheck + lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # App code and the e2e specs (e2e/tsconfig.json).
      - run: npm run typecheck
      - run: npm run lint
      # No --passWithNoTests: a run that finds no tests is a broken setup.
      - run: npm test -- --watchAll=false
        env:
          CI: true
      # CI=false: lint warnings already fail the lint step above. No TMDB key:
      # CRA only bundles REACT_APP_* variables, so it never reached the build.
      # INLINE_RUNTIME_CHUNK=false: the same bundle Dockerfile.frontend ships,
      # which nginx's CSP (script-src 'self') needs.
      - run: npm run build
        env:
          CI: false
          INLINE_RUNTIME_CHUNK: "false"

  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: cinedb_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Same pinned set as dev and the Docker image (backend/constraints.txt),
      # including the pinned ruff, so a new ruff release can't fail CI on
      # unchanged code.
      - run: pip install -r backend/requirements-test.txt -c backend/constraints.txt
      - run: ruff check backend/
      - run: python backend/manage.py migrate
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
          DB_NAME: cinedb_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          DEBUG: "True"
          TMDB_API_KEY: dummy
      # Fails when a model change has no migration.
      - run: python backend/manage.py makemigrations --check --dry-run
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
          DB_NAME: cinedb_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          DEBUG: "True"
          TMDB_API_KEY: dummy
      - run: pytest backend/ -v --tb=short
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
          DB_NAME: cinedb_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          DEBUG: "True"
          TMDB_API_KEY: dummy

  e2e-python:
    name: E2E (pytest-playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: nohup npx react-scripts start > /tmp/cra.log 2>&1 &
        env:
          BROWSER: none
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r e2e/python/requirements.txt
      # Keyed on the pip pin: its browser build can differ from the npm one.
      - id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-py-${{ runner.os }}-${{ hashFiles('e2e/python/requirements.txt') }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium
      # The cache holds the browser only; its system libraries still need installing.
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium
      # Node resolves localhost to ::1 first, but the CRA dev server only
      # listens on IPv4 — without ipv4first, wait-on hangs forever.
      - run: npx wait-on http://localhost:3000 -t 300000
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
      - name: Show dev server output
        if: always()
        run: |
          echo "--- /tmp/cra.log ---"
          cat /tmp/cra.log || echo "(no log file)"
          echo "--- listening ports ---"
          ss -tlnp || netstat -tlnp || true
          echo "--- node processes ---"
          ps aux | grep -i node || true
      - run: pytest e2e/python

  e2e-ts:
    name: E2E (Playwright TS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Both projects are Chromium (mobile-chrome is an emulated Pixel 5).
      - id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # playwright.config.ts starts the CRA dev server itself; every API call
      # is mocked (e2e/fixtures.ts). ipv4first: see the e2e-python job.
      - run: npx playwright test
        env:
          CI: true
          NODE_OPTIONS: --dns-result-order=ipv4first
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    name: Docker images (build + frontend smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Built only: running it needs Postgres and the deploy's secrets.
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          load: true
          tags: cinedb-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      # nginx resolves its proxy_pass host ("backend") at startup and won't boot
      # without it; nothing here calls /api/, so it just has to resolve.
      - name: Start frontend image
        run: |
          docker run -d --name web --add-host backend:127.0.0.1 -p 8080:80 cinedb-frontend:ci
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8080/ && exit 0
            sleep 1
          done
          echo "nginx did not come up"; docker logs web; exit 1
      - name: Check served headers
        run: bash .github/scripts/smoke-frontend.sh http://localhost:8080 web
