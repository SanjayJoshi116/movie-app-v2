name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (typecheck + lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # App code and the e2e specs (e2e/tsconfig.json).
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --watchAll=false --passWithNoTests
        env:
          CI: true
      # CI=false: lint warnings already fail the lint step above. No TMDB key:
      # CRA only bundles REACT_APP_* variables, so it never reached the build.
      # INLINE_RUNTIME_CHUNK=false: the same bundle Dockerfile.frontend ships,
      # which nginx's CSP (script-src 'self') needs.
      - run: npm run build
        env:
          CI: false
          INLINE_RUNTIME_CHUNK: "false"

  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: cinedb_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Same pinned set as dev and the Docker image (backend/constraints.txt),
      # including the pinned ruff, so a new ruff release can't fail CI on
      # unchanged code.
      - run: pip install -r backend/requirements-test.txt -c backend/constraints.txt
      - run: ruff check backend/
      - run: python backend/manage.py migrate
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
          DB_NAME: cinedb_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          DEBUG: "True"
          TMDB_API_KEY: dummy
      # Fails when a model change has no migration.
      - run: python backend/manage.py makemigrations --check --dry-run
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
          DB_NAME: cinedb_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          DEBUG: "True"
          TMDB_API_KEY: dummy
      - run: pytest backend/ -v --tb=short
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
          DB_NAME: cinedb_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          DEBUG: "True"
          TMDB_API_KEY: dummy

  e2e-python:
    name: E2E (pytest-playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: nohup npx react-scripts start > /tmp/cra.log 2>&1 &
        env:
          BROWSER: none
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r e2e/python/requirements.txt
      - run: playwright install --with-deps chromium
      # Node resolves localhost to ::1 first, but the CRA dev server only
      # listens on IPv4 — without ipv4first, wait-on hangs forever.
      - run: npx wait-on http://localhost:3000 -t 300000
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
      - name: Show dev server output
        if: always()
        run: |
          echo "--- /tmp/cra.log ---"
          cat /tmp/cra.log || echo "(no log file)"
          echo "--- listening ports ---"
          ss -tlnp || netstat -tlnp || true
          echo "--- node processes ---"
          ps aux | grep -i node || true
      - run: pytest e2e/python

  e2e-ts:
    name: E2E (Playwright TS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Both projects are Chromium (mobile-chrome is an emulated Pixel 5).
      - run: npx playwright install --with-deps chromium
      # playwright.config.ts starts the CRA dev server itself; every API call
      # is mocked (e2e/fixtures.ts). ipv4first: see the e2e-python job.
      - run: npx playwright test
        env:
          CI: true
          NODE_OPTIONS: --dns-result-order=ipv4first
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
